name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 不再用 android-actions/setup-android@v3：它内部会执行 `sdkmanager tools`，
      # 而 runner 上的 cmdline-tools 16.0 已经没有名为 tools 的包，整个 job 会直接失败。
      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），这里只补装本项目需要的组件。
      - name: Install Android SDK packages
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | head -n 1)"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # wrapper 默认指向腾讯云镜像（国内快）；CI 在海外，换回官方源再跑。
      - name: Point Gradle wrapper at the official distribution
        run: |
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: etyhan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 只在推送 tag 时跑：把刚构建出来的 APK 发成 GitHub Release。
  # 用 runner 内置的 GITHUB_TOKEN（job 级 contents: write），不需要 PAT，也不需要 gh 登录。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: etyhan-debug
          path: dist

      # tag 和 build.gradle.kts 里的 versionName 必须一致，否则发出去的包版本号对不上
      - name: Check tag matches versionName
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          echo "tag=$tag_version app=$app_version"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag $tag_version 与 versionName $app_version 不一致"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mv dist/app-debug.apk "dist/EtyHan-${version}.apk"
          # 有 docs/releases/<tag>.md 就用它当发布说明，否则让 GitHub 自动生成
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "EtyHan $version" \
              --notes-file "$notes" \
              "dist/EtyHan-${version}.apk"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "EtyHan $version" \
              --generate-notes \
              "dist/EtyHan-${version}.apk"
          fi
